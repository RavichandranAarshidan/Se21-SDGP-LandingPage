<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3A5F"/>
      <stop offset="60%" stop-color="#14263E"/>
      <stop offset="100%" stop-color="#0E1A2B"/>
    </linearGradient>
    <linearGradient id="ogOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9433"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Subtle grid pattern & glow -->
  <circle cx="950" cy="300" r="360" fill="#FF7A00" fill-opacity="0.08"/>
  <circle cx="200" cy="500" r="280" fill="#3182CE" fill-opacity="0.08"/>

  <!-- Brand Pill -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="170" height="42" rx="21" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <circle cx="24" cy="21" r="7" fill="#FF7A00"/>
    <text x="42" y="27" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">SRI LANKA</text>
  </g>

  <!-- Logo & Title -->
  <g transform="translate(100, 190)">
    <g transform="translate(0, 0)">
      <circle cx="35" cy="35" r="35" fill="url(#ogOrange)"/>
      <!-- Wrench / Car -->
      <path d="M26 44 L44 26 M40 22 L48 30 L44 34 L36 26 Z" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <text x="85" y="48" font-family="'Poppins', sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">FixMyRide</text>
    </g>

    <text x="0" y="140" font-family="'Poppins', sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">
      Broken down? Find a trusted
    </text>
    <text x="0" y="200" font-family="'Poppins', sans-serif" font-size="44" font-weight="700" fill="#FF9433">
      mechanic near you, fast.
    </text>
    
    <text x="0" y="270" font-family="'Poppins', sans-serif" font-size="20" font-weight="400" fill="#CBD5E0">
      Verified mechanics nearby • Parts availability search • Live tracking &amp; safety share.
    </text>

    <!-- Highlights -->
    <g transform="translate(0, 320)">
      <rect x="0" y="0" width="220" height="44" rx="10" fill="rgba(255,255,255,0.08)"/>
      <text x="110" y="28" font-family="'Poppins', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">✓ Verified Mechanics</text>

      <rect x="235" y="0" width="210" height="44" rx="10" fill="rgba(255,255,255,0.08)"/>
      <text x="340" y="28" font-family="'Poppins', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">✓ Parts Search</text>

      <rect x="460" y="0" width="230" height="44" rx="10" fill="rgba(255,255,255,0.08)"/>
      <text x="575" y="28" font-family="'Poppins', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">✓ Emergency 119/1990</text>
    </g>
  </g>

  <!-- Stylized Phone Illustration on Right -->
  <g transform="translate(860, 80)">
    <rect x="0" y="0" width="260" height="500" rx="34" fill="#0A0E17" stroke="#4A5568" stroke-width="4"/>
    <rect x="10" y="10" width="240" height="480" rx="26" fill="#F8FAFC"/>
    <rect x="80" y="20" width="100" height="16" rx="8" fill="#0A0E17"/>
    <!-- Mockup content -->
    <rect x="25" y="60" width="210" height="180" rx="12" fill="#E2E8F0"/>
    <circle cx="80" cy="120" r="12" fill="#FF7A00"/>
    <circle cx="160" cy="180" r="14" fill="#1F3A5F"/>
    <path d="M80 120 Q120 130 160 180" stroke="#FF7A00" stroke-width="4" stroke-dasharray="6 4" fill="none"/>
    <rect x="25" y="260" width="210" height="120" rx="12" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1"/>
    <text x="40" y="295" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#1F3A5F">Dinesh Kumara</text>
    <text x="40" y="315" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#48BB78">★ 4.9 • 5 mins away</text>
    <rect x="40" y="335" width="180" height="30" rx="8" fill="#FF7A00"/>
    <text x="130" y="355" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Live GPS Tracking</text>
  </g>
</svg>
