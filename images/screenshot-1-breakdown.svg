<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="100%" height="auto" role="img" aria-labelledby="screen1Title screen1Desc">
  <title id="screen1Title">Prototype Screen 1: Report Breakdown and Select Needed Parts</title>
  <desc id="screen1Desc">FixMyRide mobile app interface for reporting vehicle breakdown, selecting vehicle model, and searching parts inventory in Sri Lanka.</desc>
  <defs>
    <filter id="fShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F3A5F" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Frame with Shadow -->
  <rect x="10" y="10" width="300" height="600" rx="36" fill="url(#sGrad)" stroke="#E2E8F0" stroke-width="4" filter="url(#fShadow)"/>
  
  <!-- Notch -->
  <rect x="110" y="20" width="100" height="18" rx="9" fill="#1A202C"/>
  
  <!-- Status bar -->
  <text x="35" y="34" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#2D3748">09:41</text>
  <circle cx="280" cy="31" r="3" fill="#48BB78"/>

  <!-- Screen Content -->
  <!-- Header -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="28" height="28" rx="8" fill="#EDF2F7"/>
    <path d="M16 9 L11 14 L16 19" stroke="#1F3A5F" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="38" y="19" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#1F3A5F">Report Breakdown</text>
    <text x="245" y="18" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#FF7A00">Step 1/4</text>
  </g>

  <!-- Step Bar -->
  <g transform="translate(25, 95)">
    <rect x="0" y="0" width="60" height="4" rx="2" fill="#FF7A00"/>
    <rect x="68" y="0" width="60" height="4" rx="2" fill="#CBD5E0"/>
    <rect x="136" y="0" width="60" height="4" rx="2" fill="#CBD5E0"/>
    <rect x="204" y="0" width="66" height="4" rx="2" fill="#CBD5E0"/>
  </g>

  <!-- Vehicle Type Selection -->
  <g transform="translate(25, 115)">
    <text x="0" y="14" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#1F3A5F">Vehicle Type</text>
    <!-- Car pill (Active) -->
    <rect x="0" y="24" width="76" height="34" rx="10" fill="#1F3A5F"/>
    <text x="38" y="45" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Car / SUV</text>

    <!-- Three-Wheeler pill -->
    <rect x="84" y="24" width="86" height="34" rx="10" fill="#EDF2F7"/>
    <text x="127" y="45" font-family="'Poppins', sans-serif" font-size="11" font-weight="500" fill="#4A5568" text-anchor="middle">Tuk-Tuk</text>

    <!-- Motorbike pill -->
    <rect x="178" y="24" width="92" height="34" rx="10" fill="#EDF2F7"/>
    <text x="224" y="45" font-family="'Poppins', sans-serif" font-size="11" font-weight="500" fill="#4A5568" text-anchor="middle">Motorcycle</text>
  </g>

  <!-- Issue Categories -->
  <g transform="translate(25, 195)">
    <text x="0" y="14" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#1F3A5F">What is the problem?</text>
    
    <!-- Option 1: Flat Tyre -->
    <rect x="0" y="26" width="130" height="54" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="24" cy="53" r="10" fill="#F7FAFC"/>
    <circle cx="24" cy="53" r="6" stroke="#FF7A00" stroke-width="2" fill="none"/>
    <text x="44" y="50" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#1F3A5F">Flat Tyre</text>
    <text x="44" y="64" font-family="'Poppins', sans-serif" font-size="9" font-weight="400" fill="#718096">Puncture / Air</text>

    <!-- Option 2: Battery Dead (Selected) -->
    <rect x="140" y="26" width="130" height="54" rx="12" fill="#FFF5EC" stroke="#FF7A00" stroke-width="1.5"/>
    <circle cx="164" cy="53" r="10" fill="#FFEDD5"/>
    <path d="M162 48 L166 48 M164 46 L164 50 M161 54 L167 54" stroke="#FF7A00" stroke-width="1.5" stroke-linecap="round"/>
    <text x="184" y="50" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#1F3A5F">Battery Dead</text>
    <text x="184" y="64" font-family="'Poppins', sans-serif" font-size="9" font-weight="500" fill="#FF7A00">Selected</text>

    <!-- Option 3: Engine / Belt -->
    <rect x="0" y="90" width="130" height="54" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="16" y="116" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#1F3A5F">Engine Overheat</text>
    <text x="16" y="130" font-family="'Poppins', sans-serif" font-size="9" font-weight="400" fill="#718096">Coolant / Radiator</text>

    <!-- Option 4: Starter / Other -->
    <rect x="140" y="90" width="130" height="54" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="156" y="116" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#1F3A5F">Belt / Mechanical</text>
    <text x="156" y="130" font-family="'Poppins', sans-serif" font-size="9" font-weight="400" fill="#718096">Parts needed</text>
  </g>

  <!-- Part Availability Search -->
  <g transform="translate(25, 365)">
    <text x="0" y="14" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#1F3A5F">Specify Part Needed (Optional)</text>
    <rect x="0" y="24" width="270" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
    <circle cx="20" cy="45" r="5" fill="none" stroke="#718096" stroke-width="1.5"/>
    <line x1="24" y1="49" x2="28" y2="53" stroke="#718096" stroke-width="1.5" stroke-linecap="round"/>
    <text x="36" y="49" font-family="'Poppins', sans-serif" font-size="11" font-weight="500" fill="#1F3A5F">Amaron 45Ah 12V Battery</text>
    <rect x="210" y="32" width="50" height="26" rx="6" fill="#F0FFF4"/>
    <text x="235" y="48" font-family="'Poppins', sans-serif" font-size="9" font-weight="600" fill="#22543D" text-anchor="middle">Found</text>
  </g>

  <!-- Current GPS Location Box -->
  <g transform="translate(25, 450)">
    <rect x="0" y="0" width="270" height="50" rx="12" fill="#F1F5F9"/>
    <circle cx="24" cy="25" r="10" fill="#1F3A5F"/>
    <circle cx="24" cy="25" r="4" fill="#FF7A00"/>
    <text x="44" y="20" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#1F3A5F">Current Location Detected</text>
    <text x="44" y="35" font-family="'Poppins', sans-serif" font-size="10" font-weight="400" fill="#64748B">Galle Road, Bambalapitiya</text>
  </g>

  <!-- Primary CTA Button -->
  <g transform="translate(25, 520)">
    <rect x="0" y="0" width="270" height="44" rx="12" fill="#FF7A00"/>
    <text x="135" y="27" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Find Nearby Mechanics →</text>
  </g>

  <!-- Home indicator -->
  <rect x="120" y="594" width="80" height="4" rx="2" fill="#CBD5E0"/>
</svg>
