<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="100%" height="auto" role="img" aria-labelledby="screen3Title screen3Desc">
  <title id="screen3Title">Prototype Screen 3: Live Mechanic Tracking and Safety Share</title>
  <desc id="screen3Desc">Real-time GPS tracking of the dispatched mechanic, live countdown, safety share status, and emergency response dialer.</desc>
  <defs>
    <filter id="fShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F3A5F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="10" y="10" width="300" height="600" rx="36" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4" filter="url(#fShadow3)"/>
  
  <!-- Notch -->
  <rect x="110" y="20" width="100" height="18" rx="9" fill="#1A202C"/>
  <text x="35" y="34" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#2D3748">09:47</text>
  <circle cx="280" cy="31" r="3" fill="#48BB78"/>

  <!-- Header -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="28" height="28" rx="8" fill="#EDF2F7"/>
    <path d="M16 9 L11 14 L16 19" stroke="#1F3A5F" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="38" y="19" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#1F3A5F">Live Mechanic Tracking</text>
    <text x="245" y="18" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#FF7A00">Step 3/4</text>
  </g>

  <!-- Step Bar -->
  <g transform="translate(25, 95)">
    <rect x="0" y="0" width="60" height="4" rx="2" fill="#FF7A00"/>
    <rect x="68" y="0" width="60" height="4" rx="2" fill="#FF7A00"/>
    <rect x="136" y="0" width="60" height="4" rx="2" fill="#FF7A00"/>
    <rect x="204" y="0" width="66" height="4" rx="2" fill="#CBD5E0"/>
  </g>

  <!-- Map Graphic Area -->
  <g transform="translate(20, 115)">
    <rect x="0" y="0" width="280" height="240" rx="16" fill="#E2E8F0"/>
    <!-- Streets -->
    <path d="M0 60 Q120 70 280 40" stroke="#FFF" stroke-width="16" fill="none"/>
    <path d="M60 0 Q70 120 80 240" stroke="#FFF" stroke-width="14" fill="none"/>
    <path d="M200 0 Q190 120 220 240" stroke="#FFF" stroke-width="14" fill="none"/>
    <path d="M0 180 Q140 160 280 190" stroke="#FFF" stroke-width="16" fill="none"/>
    
    <!-- Route Polyline -->
    <path d="M80 65 Q130 90 200 170" fill="none" stroke="#FF7A00" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round"/>
    
    <!-- User location -->
    <circle cx="80" cy="65" r="14" fill="#FF7A00" fill-opacity="0.2"/>
    <circle cx="80" cy="65" r="7" fill="#FF7A00"/>

    <!-- Mechanic moving location -->
    <circle cx="200" cy="170" r="16" fill="#1F3A5F" fill-opacity="0.2"/>
    <circle cx="200" cy="170" r="9" fill="#1F3A5F"/>
    
    <!-- Live Badge Floating on Map -->
    <rect x="80" y="15" width="120" height="24" rx="12" fill="#1F3A5F"/>
    <circle cx="94" cy="27" r="3.5" fill="#48BB78"/>
    <text x="104" y="31" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF">En Route • 3 Mins</text>
  </g>

  <!-- Mechanic Details & Actions -->
  <g transform="translate(25, 370)">
    <rect x="0" y="0" width="270" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="32" cy="35" r="18" fill="#1F3A5F"/>
    <text x="32" y="39" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">DK</text>
    <text x="60" y="28" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#1F3A5F">Dinesh Kumara</text>
    <text x="60" y="44" font-family="'Poppins', sans-serif" font-size="10" font-weight="500" fill="#718096">Toyota Service Specialist • ★ 4.9</text>
    <!-- Call icon button -->
    <circle cx="240" cy="35" r="16" fill="#EDF2F7"/>
    <path d="M236 30 C236 29 237 28 238 28 L240 31 L238 33 C239 36 241 38 244 39 L246 37 L249 39 C249 40 248 41 247 41 C241 41 236 36 236 30 Z" fill="#1F3A5F"/>
  </g>

  <!-- Safety Share Card -->
  <g transform="translate(25, 452)">
    <rect x="0" y="0" width="270" height="52" rx="12" fill="#EBF8FF" stroke="#BEE3F8" stroke-width="1.2"/>
    <circle cx="24" cy="26" r="12" fill="#3182CE"/>
    <path d="M20 26 L23 29 L28 23" stroke="#FFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="44" y="22" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#2B6CB0">Safety Share Active</text>
    <text x="44" y="37" font-family="'Poppins', sans-serif" font-size="9.5" font-weight="500" fill="#4A5568">Live link sent to 077 •••• 912</text>
  </g>

  <!-- Emergency 119 / 1990 Button -->
  <g transform="translate(25, 516)">
    <rect x="0" y="0" width="270" height="46" rx="12" fill="#FFF5F5" stroke="#E53E3E" stroke-width="1.5"/>
    <circle cx="30" cy="23" r="10" fill="#E53E3E"/>
    <text x="30" y="27" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFF" text-anchor="middle">!</text>
    <text x="50" y="24" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#C53030">Emergency SOS (119 / 1990)</text>
    <text x="50" y="37" font-family="'Poppins', sans-serif" font-size="9" font-weight="500" fill="#E53E3E">Direct call &amp; GPS coordinates broadcast</text>
  </g>

  <!-- Home indicator -->
  <rect x="120" y="594" width="80" height="4" rx="2" fill="#CBD5E0"/>
</svg>
