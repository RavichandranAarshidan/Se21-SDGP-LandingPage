<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="100%" height="auto" role="img" aria-labelledby="screen4Title screen4Desc">
  <title id="screen4Title">Prototype Screen 4: Completion Code and Photo Proof Verification</title>
  <desc id="screen4Desc">FixMyRide job sign-off screen with secure four digit completion code and mechanic photo proof confirmation.</desc>
  <defs>
    <filter id="fShadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1F3A5F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="10" y="10" width="300" height="600" rx="36" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4" filter="url(#fShadow4)"/>
  
  <!-- Notch -->
  <rect x="110" y="20" width="100" height="18" rx="9" fill="#1A202C"/>
  <text x="35" y="34" font-family="'Poppins', sans-serif" font-size="10" font-weight="600" fill="#2D3748">10:15</text>
  <circle cx="280" cy="31" r="3" fill="#48BB78"/>

  <!-- Header -->
  <g transform="translate(25, 55)">
    <rect x="0" y="0" width="28" height="28" rx="8" fill="#EDF2F7"/>
    <path d="M16 9 L11 14 L16 19" stroke="#1F3A5F" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="38" y="19" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#1F3A5F">Job Completion</text>
    <text x="245" y="18" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#48BB78">Step 4/4</text>
  </g>

  <!-- Step Bar -->
  <g transform="translate(25, 95)">
    <rect x="0" y="0" width="60" height="4" rx="2" fill="#48BB78"/>
    <rect x="68" y="0" width="60" height="4" rx="2" fill="#48BB78"/>
    <rect x="136" y="0" width="60" height="4" rx="2" fill="#48BB78"/>
    <rect x="204" y="0" width="66" height="4" rx="2" fill="#48BB78"/>
  </g>

  <!-- Success Icon & Title -->
  <g transform="translate(25, 120)">
    <circle cx="135" cy="30" r="26" fill="#F0FFF4" stroke="#48BB78" stroke-width="2"/>
    <path d="M125 30 L132 37 L145 23" stroke="#38A169" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="135" y="74" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#1F3A5F" text-anchor="middle">Repair Complete</text>
    <text x="135" y="90" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="400" fill="#718096" text-anchor="middle">Verify repair photos and provide code to close</text>
  </g>

  <!-- 4-Digit Code Box -->
  <g transform="translate(25, 230)">
    <rect x="0" y="0" width="270" height="96" rx="14" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="1.5"/>
    <text x="135" y="24" font-family="'Poppins', sans-serif" font-size="10.5" font-weight="600" fill="#718096" text-anchor="middle">YOUR 4-DIGIT COMPLETION CODE</text>
    
    <!-- Code Digits -->
    <g transform="translate(25, 36)">
      <rect x="0" y="0" width="45" height="45" rx="8" fill="#F1F5F9" stroke="#1F3A5F" stroke-width="1.5"/>
      <text x="22" y="30" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle">5</text>
      
      <rect x="58" y="0" width="45" height="45" rx="8" fill="#F1F5F9" stroke="#1F3A5F" stroke-width="1.5"/>
      <text x="80" y="30" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle">8</text>

      <rect x="116" y="0" width="45" height="45" rx="8" fill="#F1F5F9" stroke="#1F3A5F" stroke-width="1.5"/>
      <text x="138" y="30" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle">2</text>

      <rect x="174" y="0" width="45" height="45" rx="8" fill="#F1F5F9" stroke="#1F3A5F" stroke-width="1.5"/>
      <text x="196" y="30" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#1F3A5F" text-anchor="middle">4</text>
    </g>
  </g>

  <!-- Photo Proof Section -->
  <g transform="translate(25, 345)">
    <text x="0" y="14" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#1F3A5F">Mechanic Photo Proof</text>
    <rect x="0" y="24" width="130" height="90" rx="10" fill="#EDF2F7"/>
    <!-- Photo 1 preview -->
    <path d="M20 70 L45 45 L70 70 L95 55 L115 75" stroke="#A0AEC0" stroke-width="2" fill="none"/>
    <circle cx="45" cy="45" r="6" fill="#CBD5E0"/>
    <rect x="8" y="32" width="55" height="18" rx="4" fill="#1F3A5F"/>
    <text x="35.5" y="44" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Before</text>

    <!-- Photo 2 preview -->
    <rect x="140" y="24" width="130" height="90" rx="10" fill="#EDF2F7"/>
    <path d="M160 70 L185 45 L210 70 L235 55 L255 75" stroke="#48BB78" stroke-width="2" fill="none"/>
    <circle cx="185" cy="45" r="6" fill="#9AE6B4"/>
    <rect x="148" y="32" width="60" height="18" rx="4" fill="#38A169"/>
    <text x="178" y="44" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Fixed Proof</text>
  </g>

  <!-- Confirm & Close Button -->
  <g transform="translate(25, 480)">
    <rect x="0" y="0" width="270" height="44" rx="12" fill="#1F3A5F"/>
    <text x="135" y="27" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Confirm &amp; Complete Job</text>
  </g>

  <g transform="translate(25, 535)">
    <text x="135" y="16" font-family="'Poppins', sans-serif" font-size="10" font-weight="500" fill="#718096" text-anchor="middle">Both driver &amp; mechanic keep digital records</text>
  </g>

  <!-- Home indicator -->
  <rect x="120" y="594" width="80" height="4" rx="2" fill="#CBD5E0"/>
</svg>
